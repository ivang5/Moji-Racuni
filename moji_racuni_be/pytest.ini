[pytest]
DJANGO_SETTINGS_MODULE = moji_racuni_be.settings
python_files = test_*.py
# Test baza (test_<DB_NAME>) se ne briše između pokretanja; posle izmene modela/migracija: pytest --create-db
addopts = --reuse-db
# xfail testovi moraju da padaju; ako počnu da prolaze, to je greška u testu
xfail_strict = true
