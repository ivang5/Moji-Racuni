[project]
name = "moji-racuni-be"
version = "0.1.0"
description = "Backend aplikacije Moji Računi (Django + Django REST Framework)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
    # Build zahteva pkg-config i MariaDB Connector/C (ili MySQL client) header-e
    "mysqlclient>=2.3.2",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "factory-boy>=3.3.3",
    # Testovi direktno dekodiraju JWT
    "pyjwt>=2.15.1",
]
